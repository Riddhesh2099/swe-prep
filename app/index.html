<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SWE Interview Prep</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --bg: #0f1117;
      --sidebar-bg: #161b22;
      --content-bg: #0d1117;
      --border: #30363d;
      --text: #e6edf3;
      --text-muted: #8b949e;
      --accent: #58a6ff;
      --accent-hover: #79c0ff;
      --green: #3fb950;
      --tag-hld: #1f6feb;
      --tag-lld: #388bfd;
      --tag-prep: #56d364;
      --code-bg: #161b22;
      --table-border: #30363d;
      --sidebar-width: 280px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* SIDEBAR */
    #sidebar {
      width: var(--sidebar-width);
      background: var(--sidebar-bg);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      flex-shrink: 0;
    }

    #sidebar-header {
      padding: 20px 16px 12px;
      border-bottom: 1px solid var(--border);
    }

    #sidebar-header h1 {
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 4px;
    }

    #sidebar-header p {
      font-size: 12px;
      color: var(--text-muted);
    }

    #progress-bar-wrap {
      margin-top: 10px;
      background: var(--border);
      border-radius: 4px;
      height: 4px;
      overflow: hidden;
    }

    #progress-bar {
      height: 100%;
      background: var(--green);
      border-radius: 4px;
      transition: width 0.3s ease;
    }

    #progress-label {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    #nav {
      overflow-y: auto;
      flex: 1;
      padding: 8px 0;
    }

    .nav-section {
      margin-bottom: 4px;
    }

    .nav-section-title {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      padding: 8px 16px 4px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 16px;
      cursor: pointer;
      border-radius: 0;
      font-size: 13px;
      color: var(--text-muted);
      transition: background 0.15s, color 0.15s;
      border-left: 2px solid transparent;
    }

    .nav-item:hover {
      background: rgba(88, 166, 255, 0.08);
      color: var(--text);
    }

    .nav-item.active {
      background: rgba(88, 166, 255, 0.12);
      color: var(--accent);
      border-left-color: var(--accent);
    }

    .nav-item .read-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--border);
      flex-shrink: 0;
      margin-left: auto;
    }

    .nav-item.read .read-dot {
      background: var(--green);
    }

    .tag {
      font-size: 10px;
      font-weight: 600;
      padding: 1px 6px;
      border-radius: 10px;
      flex-shrink: 0;
    }

    .tag-hld { background: rgba(31,111,235,0.2); color: #58a6ff; }
    .tag-lld { background: rgba(56,139,253,0.2); color: #79c0ff; }
    .tag-prep { background: rgba(86,211,100,0.2); color: #56d364; }

    /* MAIN */
    #main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #topbar {
      padding: 12px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--content-bg);
      flex-shrink: 0;
    }

    #topbar-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
    }

    #topbar-actions {
      display: flex;
      gap: 8px;
    }

    .btn {
      font-size: 12px;
      padding: 5px 12px;
      border-radius: 6px;
      border: 1px solid var(--border);
      cursor: pointer;
      font-weight: 500;
      transition: all 0.15s;
    }

    .btn-mark {
      background: rgba(63,185,80,0.1);
      color: var(--green);
      border-color: rgba(63,185,80,0.3);
    }

    .btn-mark:hover {
      background: rgba(63,185,80,0.2);
    }

    .btn-mark.marked {
      background: var(--green);
      color: #0d1117;
      border-color: var(--green);
    }

    .btn-reset {
      background: transparent;
      color: var(--text-muted);
    }

    .btn-reset:hover {
      color: var(--text);
      background: rgba(255,255,255,0.05);
    }

    #content {
      flex: 1;
      overflow-y: auto;
      padding: 32px 48px;
      background: var(--content-bg);
    }

    #welcome {
      max-width: 640px;
      margin: 60px auto;
      text-align: center;
    }

    #welcome h2 {
      font-size: 24px;
      margin-bottom: 12px;
      color: var(--text);
    }

    #welcome p {
      color: var(--text-muted);
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 24px;
    }

    .welcome-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-top: 24px;
    }

    .welcome-card {
      background: var(--sidebar-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      text-align: left;
      cursor: pointer;
      transition: border-color 0.15s;
    }

    .welcome-card:hover { border-color: var(--accent); }

    .welcome-card .card-tag { margin-bottom: 8px; display: inline-block; }
    .welcome-card h3 { font-size: 13px; color: var(--text); margin-bottom: 4px; }
    .welcome-card p { font-size: 12px; color: var(--text-muted); }

    /* MARKDOWN STYLES */
    #md-content {
      max-width: 820px;
      line-height: 1.7;
      font-size: 14px;
    }

    #md-content h1 {
      font-size: 24px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 8px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    #md-content h2 {
      font-size: 18px;
      font-weight: 600;
      color: var(--text);
      margin: 28px 0 12px;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--border);
    }

    #md-content h3 {
      font-size: 15px;
      font-weight: 600;
      color: var(--accent);
      margin: 20px 0 8px;
    }

    #md-content h4 {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      margin: 16px 0 6px;
    }

    #md-content p {
      margin-bottom: 12px;
      color: var(--text);
    }

    #md-content ul, #md-content ol {
      margin: 8px 0 12px 20px;
    }

    #md-content li {
      margin-bottom: 4px;
      color: var(--text);
    }

    #md-content li input[type="checkbox"] {
      margin-right: 6px;
      accent-color: var(--green);
      cursor: pointer;
    }

    #md-content code {
      background: var(--code-bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 1px 6px;
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
      font-size: 12px;
      color: #f0883e;
    }

    #md-content pre {
      background: var(--code-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      overflow-x: auto;
      margin: 12px 0;
    }

    #md-content pre code {
      background: none;
      border: none;
      padding: 0;
      color: #e6edf3;
      font-size: 13px;
    }

    #md-content blockquote {
      border-left: 3px solid var(--accent);
      padding: 8px 16px;
      margin: 12px 0;
      background: rgba(88,166,255,0.05);
      border-radius: 0 6px 6px 0;
      color: var(--text-muted);
      font-style: italic;
    }

    #md-content table {
      width: 100%;
      border-collapse: collapse;
      margin: 12px 0;
      font-size: 13px;
    }

    #md-content th {
      background: var(--sidebar-bg);
      color: var(--text);
      font-weight: 600;
      padding: 8px 12px;
      text-align: left;
      border: 1px solid var(--table-border);
    }

    #md-content td {
      padding: 7px 12px;
      border: 1px solid var(--table-border);
      color: var(--text);
    }

    #md-content tr:nth-child(even) td {
      background: rgba(255,255,255,0.02);
    }

    #md-content a {
      color: var(--accent);
      text-decoration: none;
    }

    #md-content a:hover { text-decoration: underline; }

    #md-content hr {
      border: none;
      border-top: 1px solid var(--border);
      margin: 24px 0;
    }

    #md-content strong { color: var(--text); font-weight: 600; }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #484f58; }
  </style>
</head>
<body>

<div id="sidebar">
  <div id="sidebar-header">
    <h1>📚 SWE Interview Prep</h1>
    <p>Senior Engineer Track</p>
    <div id="progress-bar-wrap">
      <div id="progress-bar" style="width:0%"></div>
    </div>
    <div id="progress-label">0 / 10 topics read</div>
    <a href="ats.html" style="display:block;margin-top:10px;font-size:12px;color:#58a6ff;text-decoration:none;padding:6px 10px;background:rgba(88,166,255,0.1);border-radius:6px;border:1px solid rgba(88,166,255,0.2);text-align:center;">🎯 ATS Resume Review</a>
  </div>
  <div id="nav"></div>
</div>

<div id="main">
  <div id="topbar">
    <span id="topbar-title">Select a topic to begin</span>
    <div id="topbar-actions">
      <button class="btn btn-mark" id="btn-mark" onclick="toggleRead()" style="display:none">Mark as Read</button>
      <button class="btn btn-reset" onclick="resetProgress()">Reset Progress</button>
    </div>
  </div>
  <div id="content">
    <div id="welcome">
      <h2>Welcome back 👋</h2>
      <p>Your senior SWE interview prep hub. Pick a topic from the sidebar or jump into a section below.</p>
      <div class="welcome-grid" id="welcome-grid"></div>
    </div>
    <div id="md-content" style="display:none"></div>
  </div>
</div>

<script>
// ─── CONTENT ────────────────────────────────────────────────────────────────

const FILES = [
  {
    id: 'checklist',
    title: 'Interview Checklist',
    category: 'Prep',
    tag: 'prep',
    desc: 'Full tick-box checklist across DSA, HLD, LLD, behavioral'
  },
  {
    id: 'roadmap',
    title: '10-Week Roadmap',
    category: 'Prep',
    tag: 'prep',
    desc: 'Phased study plan with 40/30/30 split'
  },
  {
    id: 'topics',
    title: 'Topics Overview',
    category: 'Prep',
    tag: 'prep',
    desc: 'All topics, patterns, resources in one place'
  },
  {
    id: 'hld_01',
    title: 'Fundamentals',
    category: 'HLD',
    tag: 'hld',
    desc: 'Scalability, load balancing, CAP theorem, estimation'
  },
  {
    id: 'hld_02',
    title: 'Caching',
    category: 'HLD',
    tag: 'hld',
    desc: 'Redis, CDN, eviction policies, cache invalidation'
  },
  {
    id: 'hld_03',
    title: 'Databases',
    category: 'HLD',
    tag: 'hld',
    desc: 'SQL vs NoSQL, sharding, replication, indexing'
  },
  {
    id: 'hld_04',
    title: 'Messaging',
    category: 'HLD',
    tag: 'hld',
    desc: 'Kafka, SQS, RabbitMQ, pub/sub patterns'
  },
  {
    id: 'hld_05',
    title: 'API Design',
    category: 'HLD',
    tag: 'hld',
    desc: 'REST, gRPC, GraphQL, rate limiting, pagination'
  },
  {
    id: 'hld_06',
    title: 'Distributed Systems',
    category: 'HLD',
    tag: 'hld',
    desc: 'Consistent hashing, Raft, Saga, distributed locks'
  },
  {
    id: 'hld_07',
    title: 'System Designs',
    category: 'HLD',
    tag: 'hld',
    desc: 'Worked examples: Twitter, WhatsApp, YouTube, Uber...'
  },
  {
    id: 'lld_01',
    title: 'SOLID Principles',
    category: 'LLD',
    tag: 'lld',
    desc: 'All 5 principles with Java code examples'
  },
  {
    id: 'lld_02',
    title: 'Design Patterns',
    category: 'LLD',
    tag: 'lld',
    desc: '12 patterns: Creational, Structural, Behavioral'
  },
  {
    id: 'lld_03',
    title: 'OOD Problems',
    category: 'LLD',
    tag: 'lld',
    desc: 'Parking lot, elevator, chess, hotel booking, Splitwise'
  }
];

// ─── MARKDOWN CONTENT (embedded) ────────────────────────────────────────────
// Content is loaded from the CONTENT object below
const CONTENT = {};
</script>
<script src="content.js"></script>
<script>
// ─── STATE ──────────────────────────────────────────────────────────────────

let currentId = null;

function getRead() {
  try { return JSON.parse(localStorage.getItem('prep_read') || '{}'); } catch { return {}; }
}

function setRead(id, val) {
  const r = getRead();
  r[id] = val;
  localStorage.setItem('prep_read', JSON.stringify(r));
}

function resetProgress() {
  if (confirm('Reset all progress?')) {
    localStorage.removeItem('prep_read');
    renderNav();
    updateProgress();
    if (currentId) renderTopbar();
  }
}

// ─── PROGRESS ───────────────────────────────────────────────────────────────

function updateProgress() {
  const read = getRead();
  const total = FILES.length;
  const done = FILES.filter(f => read[f.id]).length;
  const pct = total ? Math.round(done / total * 100) : 0;
  document.getElementById('progress-bar').style.width = pct + '%';
  document.getElementById('progress-label').textContent = `${done} / ${total} topics read`;
}

// ─── NAV ────────────────────────────────────────────────────────────────────

function renderNav() {
  const read = getRead();
  const nav = document.getElementById('nav');
  const categories = ['Prep', 'HLD', 'LLD'];
  nav.innerHTML = categories.map(cat => {
    const items = FILES.filter(f => f.category === cat);
    return `
      <div class="nav-section">
        <div class="nav-section-title">${cat}</div>
        ${items.map(f => `
          <div class="nav-item ${f.id === currentId ? 'active' : ''} ${read[f.id] ? 'read' : ''}"
               onclick="loadFile('${f.id}')">
            <span class="tag tag-${f.tag}">${f.tag.toUpperCase()}</span>
            <span>${f.title}</span>
            <span class="read-dot" title="${read[f.id] ? 'Read' : 'Unread'}"></span>
          </div>
        `).join('')}
      </div>
    `;
  }).join('');
}

// ─── WELCOME GRID ───────────────────────────────────────────────────────────

function renderWelcome() {
  const grid = document.getElementById('welcome-grid');
  const featured = ['hld_01', 'hld_07', 'lld_01', 'lld_02', 'hld_03', 'checklist'];
  grid.innerHTML = featured.map(id => {
    const f = FILES.find(x => x.id === id);
    return `
      <div class="welcome-card" onclick="loadFile('${f.id}')">
        <span class="tag tag-${f.tag} card-tag">${f.tag.toUpperCase()}</span>
        <h3>${f.title}</h3>
        <p>${f.desc}</p>
      </div>
    `;
  }).join('');
}

// ─── LOAD FILE ──────────────────────────────────────────────────────────────

function loadFile(id) {
  currentId = id;
  const file = FILES.find(f => f.id === id);
  const md = CONTENT[id] || '# Content not found';

  document.getElementById('welcome').style.display = 'none';
  document.getElementById('md-content').style.display = 'block';

  // Parse markdown — handle checkboxes specially
  let html = marked.parse(md);

  // Make checkboxes interactive and sync with localStorage
  const read = getRead();
  const checkboxState = JSON.parse(localStorage.getItem('prep_checks_' + id) || '{}');

  document.getElementById('md-content').innerHTML = html;

  // Make checkboxes interactive
  document.querySelectorAll('#md-content input[type="checkbox"]').forEach((cb, i) => {
    cb.disabled = false;
    cb.checked = checkboxState[i] !== undefined ? checkboxState[i] : cb.checked;
    cb.addEventListener('change', () => {
      const state = JSON.parse(localStorage.getItem('prep_checks_' + id) || '{}');
      state[i] = cb.checked;
      localStorage.setItem('prep_checks_' + id, JSON.stringify(state));
    });
  });

  renderNav();
  renderTopbar();
  updateProgress();

  // Scroll to top
  document.getElementById('content').scrollTop = 0;
}

// ─── TOPBAR ─────────────────────────────────────────────────────────────────

function renderTopbar() {
  const file = FILES.find(f => f.id === currentId);
  const read = getRead();
  document.getElementById('topbar-title').textContent = file ? `${file.category} › ${file.title}` : 'Select a topic';
  const btn = document.getElementById('btn-mark');
  btn.style.display = file ? 'inline-block' : 'none';
  if (read[currentId]) {
    btn.textContent = '✓ Read';
    btn.classList.add('marked');
  } else {
    btn.textContent = 'Mark as Read';
    btn.classList.remove('marked');
  }
}

function toggleRead() {
  if (!currentId) return;
  const read = getRead();
  setRead(currentId, !read[currentId]);
  renderNav();
  renderTopbar();
  updateProgress();
}

// ─── INIT ────────────────────────────────────────────────────────────────────

renderNav();
renderWelcome();
updateProgress();
</script>
</body>
</html>
