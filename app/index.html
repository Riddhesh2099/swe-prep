<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SWE Interview Prep</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --bg: #0f1117;
      --sidebar-bg: #161b22;
      --content-bg: #0d1117;
      --border: #30363d;
      --text: #e6edf3;
      --text-muted: #8b949e;
      --accent: #58a6ff;
      --green: #3fb950;
      --code-bg: #161b22;
      --table-border: #30363d;
      --sidebar-width: 280px;
      --topbar-height: 48px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* ── SIDEBAR ─────────────────────────────────────────── */
    #sidebar {
      width: var(--sidebar-width);
      background: var(--sidebar-bg);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      flex-shrink: 0;
      transition: transform 0.25s ease;
      z-index: 100;
    }

    #sidebar-header {
      padding: 16px 16px 12px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    #sidebar-header h1 {
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 2px;
    }

    #sidebar-header p {
      font-size: 12px;
      color: var(--text-muted);
    }

    #progress-bar-wrap {
      margin-top: 10px;
      background: var(--border);
      border-radius: 4px;
      height: 4px;
      overflow: hidden;
    }

    #progress-bar {
      height: 100%;
      background: var(--green);
      border-radius: 4px;
      transition: width 0.3s ease;
    }

    #progress-label {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    #nav {
      overflow-y: auto;
      flex: 1;
      padding: 8px 0;
    }

    /* Collapsible nav sections */
    .nav-section { margin-bottom: 2px; }

    .nav-section-title {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      padding: 8px 16px 4px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      user-select: none;
      transition: color 0.15s;
    }

    .nav-section-title:hover { color: var(--text); }

    .nav-section-title .chevron {
      font-size: 10px;
      transition: transform 0.2s ease;
    }

    .nav-section.collapsed .chevron { transform: rotate(-90deg); }
    .nav-section.collapsed .nav-items { display: none; }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 16px;
      cursor: pointer;
      font-size: 13px;
      color: var(--text-muted);
      transition: background 0.15s, color 0.15s;
      border-left: 2px solid transparent;
    }

    .nav-item:hover {
      background: rgba(88, 166, 255, 0.08);
      color: var(--text);
    }

    .nav-item.active {
      background: rgba(88, 166, 255, 0.12);
      color: var(--accent);
      border-left-color: var(--accent);
    }

    .nav-item .read-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--border);
      flex-shrink: 0;
      margin-left: auto;
    }

    .nav-item.read .read-dot { background: var(--green); }

    .tag {
      font-size: 10px;
      font-weight: 600;
      padding: 1px 6px;
      border-radius: 10px;
      flex-shrink: 0;
    }

    .tag-hld { background: rgba(31,111,235,0.2); color: #58a6ff; }
    .tag-lld { background: rgba(56,139,253,0.2); color: #79c0ff; }
    .tag-prep { background: rgba(86,211,100,0.2); color: #56d364; }

    /* ── MAIN ────────────────────────────────────────────── */
    #main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-width: 0;
    }

    #topbar {
      padding: 0 16px;
      height: var(--topbar-height);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--content-bg);
      flex-shrink: 0;
      gap: 8px;
    }

    #topbar-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    /* Hamburger — hidden on desktop */
    #hamburger {
      display: none;
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px;
      color: var(--text-muted);
      flex-shrink: 0;
    }

    #hamburger:hover { color: var(--text); }

    #hamburger svg { display: block; }

    #topbar-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #topbar-actions { display: flex; gap: 8px; flex-shrink: 0; }

    .btn {
      font-size: 12px;
      padding: 5px 10px;
      border-radius: 6px;
      border: 1px solid var(--border);
      cursor: pointer;
      font-weight: 500;
      transition: all 0.15s;
      white-space: nowrap;
    }

    .btn-mark {
      background: rgba(63,185,80,0.1);
      color: var(--green);
      border-color: rgba(63,185,80,0.3);
    }

    .btn-mark:hover { background: rgba(63,185,80,0.2); }

    .btn-mark.marked {
      background: var(--green);
      color: #0d1117;
      border-color: var(--green);
    }

    .btn-reset {
      background: transparent;
      color: var(--text-muted);
    }

    .btn-reset:hover {
      color: var(--text);
      background: rgba(255,255,255,0.05);
    }

    #content {
      flex: 1;
      overflow-y: auto;
      padding: 28px 32px;
      background: var(--content-bg);
    }

    /* ── WELCOME ─────────────────────────────────────────── */
    #welcome {
      max-width: 640px;
      margin: 40px auto;
      text-align: center;
    }

    #welcome h2 { font-size: 22px; margin-bottom: 10px; }

    #welcome p {
      color: var(--text-muted);
      font-size: 14px;
      line-height: 1.6;
    }

    .welcome-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 24px;
    }

    .welcome-card {
      background: var(--sidebar-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px;
      text-align: left;
      cursor: pointer;
      transition: border-color 0.15s;
    }

    .welcome-card:hover { border-color: var(--accent); }
    .welcome-card .card-tag { margin-bottom: 6px; display: inline-block; }
    .welcome-card h3 { font-size: 13px; color: var(--text); margin-bottom: 3px; }
    .welcome-card p { font-size: 12px; color: var(--text-muted); }

    /* ── MARKDOWN ────────────────────────────────────────── */
    #md-content {
      max-width: 820px;
      line-height: 1.7;
      font-size: 14px;
    }

    #md-content h1 {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 8px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }

    #md-content h2 {
      font-size: 17px;
      font-weight: 600;
      margin: 24px 0 10px;
      padding-bottom: 5px;
      border-bottom: 1px solid var(--border);
    }

    #md-content h3 {
      font-size: 14px;
      font-weight: 600;
      color: var(--accent);
      margin: 18px 0 7px;
    }

    #md-content h4 {
      font-size: 13px;
      font-weight: 600;
      margin: 14px 0 5px;
    }

    #md-content p { margin-bottom: 10px; }

    #md-content ul, #md-content ol {
      margin: 6px 0 10px 20px;
    }

    #md-content li { margin-bottom: 3px; }

    #md-content li input[type="checkbox"] {
      margin-right: 6px;
      accent-color: var(--green);
      cursor: pointer;
    }

    #md-content code {
      background: var(--code-bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 1px 5px;
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
      font-size: 12px;
      color: #f0883e;
    }

    #md-content pre {
      background: var(--code-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px;
      overflow-x: auto;
      margin: 10px 0;
      -webkit-overflow-scrolling: touch;
    }

    #md-content pre code {
      background: none;
      border: none;
      padding: 0;
      color: #e6edf3;
      font-size: 12px;
    }

    #md-content blockquote {
      border-left: 3px solid var(--accent);
      padding: 8px 14px;
      margin: 10px 0;
      background: rgba(88,166,255,0.05);
      border-radius: 0 6px 6px 0;
      color: var(--text-muted);
      font-style: italic;
    }

    /* Responsive table wrapper */
    .table-wrap {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      margin: 10px 0;
    }

    #md-content table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      min-width: 400px;
    }

    #md-content th {
      background: var(--sidebar-bg);
      font-weight: 600;
      padding: 7px 10px;
      text-align: left;
      border: 1px solid var(--table-border);
    }

    #md-content td {
      padding: 6px 10px;
      border: 1px solid var(--table-border);
    }

    #md-content tr:nth-child(even) td {
      background: rgba(255,255,255,0.02);
    }

    #md-content a { color: var(--accent); text-decoration: none; }
    #md-content a:hover { text-decoration: underline; }

    #md-content hr {
      border: none;
      border-top: 1px solid var(--border);
      margin: 20px 0;
    }

    #md-content strong { font-weight: 600; }

    /* ── OVERLAY (mobile) ────────────────────────────────── */
    #overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 99;
    }

    /* ── SCROLLBAR ───────────────────────────────────────── */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #484f58; }

    /* ── MOBILE ──────────────────────────────────────────── */
    @media (max-width: 700px) {
      body { overflow: hidden; }

      #sidebar {
        position: fixed;
        top: 0;
        left: 0;
        height: 100%;
        transform: translateX(-100%);
      }

      #sidebar.open {
        transform: translateX(0);
        box-shadow: 4px 0 20px rgba(0,0,0,0.5);
      }

      #overlay.open { display: block; }

      #hamburger { display: flex; }

      #content { padding: 20px 16px; }

      .welcome-grid { grid-template-columns: repeat(2, 1fr); }

      #md-content { font-size: 13px; }

      #topbar-title { font-size: 13px; }

      .btn { font-size: 11px; padding: 4px 8px; }
    }

    @media (max-width: 400px) {
      .welcome-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<div id="overlay" onclick="closeSidebar()"></div>

<div id="sidebar">
  <div id="sidebar-header">
    <h1>📚 SWE Interview Prep</h1>
    <p>Senior Engineer Track</p>
    <div id="progress-bar-wrap">
      <div id="progress-bar" style="width:0%"></div>
    </div>
    <div id="progress-label">0 / 13 topics read</div>
  </div>
  <div id="nav"></div>
</div>

<div id="main">
  <div id="topbar">
    <div id="topbar-left">
      <button id="hamburger" onclick="toggleSidebar()" aria-label="Menu">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="currentColor">
          <rect y="2" width="18" height="2" rx="1"/>
          <rect y="8" width="18" height="2" rx="1"/>
          <rect y="14" width="18" height="2" rx="1"/>
        </svg>
      </button>
      <span id="topbar-title">Select a topic to begin</span>
    </div>
    <div id="topbar-actions">
      <button class="btn btn-mark" id="btn-mark" onclick="toggleRead()" style="display:none">Mark as Read</button>
      <button class="btn btn-reset" onclick="resetProgress()">Reset</button>
    </div>
  </div>
  <div id="content">
    <div id="welcome">
      <h2>Welcome back 👋</h2>
      <p>Your senior SWE interview prep hub. Pick a topic from the sidebar or jump in below.</p>
      <div class="welcome-grid" id="welcome-grid"></div>
    </div>
    <div id="md-content" style="display:none"></div>
  </div>
</div>

<script>
const FILES = [
  { id: 'checklist', title: 'Interview Checklist', category: 'Prep', tag: 'prep', desc: 'Full tick-box checklist across DSA, HLD, LLD, behavioral' },
  { id: 'roadmap',   title: '10-Week Roadmap',     category: 'Prep', tag: 'prep', desc: 'Phased study plan with 40/30/30 split' },
  { id: 'topics',    title: 'Topics Overview',     category: 'Prep', tag: 'prep', desc: 'All topics, patterns, resources in one place' },
  { id: 'hld_01', title: 'Fundamentals',        category: 'HLD', tag: 'hld', desc: 'Scalability, load balancing, CAP theorem, estimation' },
  { id: 'hld_02', title: 'Caching',             category: 'HLD', tag: 'hld', desc: 'Redis, CDN, eviction policies, cache invalidation' },
  { id: 'hld_03', title: 'Databases',           category: 'HLD', tag: 'hld', desc: 'SQL vs NoSQL, sharding, replication, indexing' },
  { id: 'hld_04', title: 'Messaging',           category: 'HLD', tag: 'hld', desc: 'Kafka, SQS, RabbitMQ, pub/sub patterns' },
  { id: 'hld_05', title: 'API Design',          category: 'HLD', tag: 'hld', desc: 'REST, gRPC, GraphQL, rate limiting, pagination' },
  { id: 'hld_06', title: 'Distributed Systems', category: 'HLD', tag: 'hld', desc: 'Consistent hashing, Raft, Saga, distributed locks' },
  { id: 'hld_07', title: 'System Designs',      category: 'HLD', tag: 'hld', desc: 'Worked examples: Twitter, WhatsApp, YouTube, Uber...' },
  { id: 'hld_08', title: 'Docker & Kubernetes',  category: 'HLD', tag: 'hld', desc: 'Containers, orchestration, Pods, Services, scaling' },
  { id: 'lld_01', title: 'SOLID Principles',    category: 'LLD', tag: 'lld', desc: 'All 5 principles with Java code examples' },
  { id: 'lld_02', title: 'Design Patterns',     category: 'LLD', tag: 'lld', desc: '12 patterns: Creational, Structural, Behavioral' },
  { id: 'lld_03', title: 'OOD Problems',        category: 'LLD', tag: 'lld', desc: 'Parking lot, elevator, chess, hotel booking, Splitwise' }
];

const CONTENT = {};
</script>
<script src="content.js"></script>
<script>
let currentId = null;

// ── SIDEBAR TOGGLE (mobile) ──────────────────────────────
function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('overlay').classList.toggle('open');
}

function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('overlay').classList.remove('open');
}

// ── PROGRESS ────────────────────────────────────────────
function getRead() {
  try { return JSON.parse(localStorage.getItem('prep_read') || '{}'); } catch { return {}; }
}

function setRead(id, val) {
  const r = getRead(); r[id] = val;
  localStorage.setItem('prep_read', JSON.stringify(r));
}

function updateProgress() {
  const read = getRead();
  const total = FILES.length;
  const done = FILES.filter(f => read[f.id]).length;
  const pct = total ? Math.round(done / total * 100) : 0;
  document.getElementById('progress-bar').style.width = pct + '%';
  document.getElementById('progress-label').textContent = `${done} / ${total} topics read`;
}

function resetProgress() {
  if (confirm('Reset all progress?')) {
    localStorage.removeItem('prep_read');
    renderNav(); updateProgress();
    if (currentId) renderTopbar();
  }
}

// ── NAV (collapsible sections) ───────────────────────────
function getCollapsed() {
  try { return JSON.parse(localStorage.getItem('prep_collapsed') || '{}'); } catch { return {}; }
}

function toggleSection(cat) {
  const c = getCollapsed();
  c[cat] = !c[cat];
  localStorage.setItem('prep_collapsed', JSON.stringify(c));
  renderNav();
}

function renderNav() {
  const read = getRead();
  const collapsed = getCollapsed();
  const nav = document.getElementById('nav');
  const categories = ['Prep', 'HLD', 'LLD'];
  nav.innerHTML = categories.map(cat => {
    const items = FILES.filter(f => f.category === cat);
    const isCollapsed = collapsed[cat];
    const doneCount = items.filter(f => read[f.id]).length;
    return `
      <div class="nav-section ${isCollapsed ? 'collapsed' : ''}">
        <div class="nav-section-title" onclick="toggleSection('${cat}')">
          <span>${cat} <span style="color:var(--green);font-size:10px">${doneCount}/${items.length}</span></span>
          <span class="chevron">▾</span>
        </div>
        <div class="nav-items">
          ${items.map(f => `
            <div class="nav-item ${f.id === currentId ? 'active' : ''} ${read[f.id] ? 'read' : ''}"
                 onclick="loadFile('${f.id}')">
              <span class="tag tag-${f.tag}">${f.tag.toUpperCase()}</span>
              <span>${f.title}</span>
              <span class="read-dot"></span>
            </div>
          `).join('')}
        </div>
      </div>
    `;
  }).join('');
}

// ── WELCOME GRID ─────────────────────────────────────────
function renderWelcome() {
  const grid = document.getElementById('welcome-grid');
  const featured = ['hld_01', 'hld_07', 'lld_01', 'lld_02', 'hld_03', 'checklist'];
  grid.innerHTML = featured.map(id => {
    const f = FILES.find(x => x.id === id);
    return `
      <div class="welcome-card" onclick="loadFile('${f.id}')">
        <span class="tag tag-${f.tag} card-tag">${f.tag.toUpperCase()}</span>
        <h3>${f.title}</h3>
        <p>${f.desc}</p>
      </div>
    `;
  }).join('');
}

// ── LOAD FILE ────────────────────────────────────────────
function loadFile(id) {
  currentId = id;
  const md = CONTENT[id] || '# Content not found\n\nThis topic has no content yet.';

  document.getElementById('welcome').style.display = 'none';
  document.getElementById('md-content').style.display = 'block';
  document.getElementById('md-content').innerHTML = marked.parse(md);

  // Wrap tables for horizontal scroll on mobile
  document.querySelectorAll('#md-content table').forEach(t => {
    if (!t.parentElement.classList.contains('table-wrap')) {
      const wrap = document.createElement('div');
      wrap.className = 'table-wrap';
      t.parentNode.insertBefore(wrap, t);
      wrap.appendChild(t);
    }
  });

  // Interactive checkboxes
  const checkboxState = JSON.parse(localStorage.getItem('prep_checks_' + id) || '{}');
  document.querySelectorAll('#md-content input[type="checkbox"]').forEach((cb, i) => {
    cb.disabled = false;
    cb.checked = checkboxState[i] !== undefined ? checkboxState[i] : cb.checked;
    cb.addEventListener('change', () => {
      const state = JSON.parse(localStorage.getItem('prep_checks_' + id) || '{}');
      state[i] = cb.checked;
      localStorage.setItem('prep_checks_' + id, JSON.stringify(state));
    });
  });

  renderNav();
  renderTopbar();
  updateProgress();
  document.getElementById('content').scrollTop = 0;
  closeSidebar(); // auto-close on mobile after selection
}

// ── TOPBAR ───────────────────────────────────────────────
function renderTopbar() {
  const file = FILES.find(f => f.id === currentId);
  const read = getRead();
  document.getElementById('topbar-title').textContent =
    file ? `${file.category} › ${file.title}` : 'Select a topic';
  const btn = document.getElementById('btn-mark');
  btn.style.display = file ? 'inline-block' : 'none';
  btn.textContent = read[currentId] ? '✓ Read' : 'Mark as Read';
  btn.classList.toggle('marked', !!read[currentId]);
}

function toggleRead() {
  if (!currentId) return;
  const read = getRead();
  setRead(currentId, !read[currentId]);
  renderNav(); renderTopbar(); updateProgress();
}

// ── INIT ─────────────────────────────────────────────────
renderNav();
renderWelcome();
updateProgress();
</script>
</body>
</html>
